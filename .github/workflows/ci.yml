name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omniaskai
          POSTGRES_PASSWORD: omniaskai
          POSTGRES_DB: omniaskai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniaskai -d omniaskai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://omniaskai:omniaskai@localhost:5432/omniaskai_test
      TEST_DATABASE_URL: postgres://omniaskai:omniaskai@localhost:5432/omniaskai_test
      APP_ORIGIN: http://localhost:3011
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDIA_STORAGE_DIR: /tmp/omniaskai-media

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Integration test
        run: npm run test:integration

      - name: Build
        run: npm run build
