services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omniaskai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: omniaskai
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - omniaskai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniaskai -d omniaskai"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  omniaskai_postgres_data:
