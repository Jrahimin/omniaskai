server {
    listen 80;
    listen [::]:80;
    server_name omniaskai.com www.omniaskai.com;
    return 308 https://omniaskai.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.omniaskai.com;

    ssl_certificate /etc/ssl/cloudflare/omniaskai.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/omniaskai.com.key;
    return 308 https://omniaskai.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name omniaskai.com;

    ssl_certificate /etc/ssl/cloudflare/omniaskai.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/omniaskai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;

    location ~ ^/api/topics/[^/]+/conversation-turns$ {
        proxy_pass http://127.0.0.1:3011;
        include snippets/proxy-common.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        include snippets/proxy-common.conf;
    }
}
